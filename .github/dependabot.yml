# Dependabot 設定
# https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference
#
# 既存設定は open-pull-requests-limit: 0 でバージョン更新を止めていた。
# PR が乱立するのを避けるための措置だったが、minor/patch をグループ化すれば
# 本数は抑えられるため、上限を設けたうえで更新を再開する。
# 今回あらたに対象へ追加するエコシステム: github-actions
#
# 方針: minor/patch はグループ化して 1 PR にまとめ、major は個別 PR で判断する。
#       リリース直後の不具合や yank を踏まないよう cooldown で寝かせてから PR を出す。

version: 2

updates:
  # ---------------------------------------------------------------------------
  # npm
  # ---------------------------------------------------------------------------
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 7
      semver-major-days: 30
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # react のメジャー更新は周辺ライブラリの対応状況をまとめて確認してから
      # 手動で判断する(2026-08 に semantic-ui-react が React 19 の findDOMNode
      # 削除で実行時クラッシュし、本番が白画面になった経緯がある。同ライブラリは
      # 廃止済みだが、major はマウントスモークテストと実ブラウザで検証してから上げる)。
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      # @types/node は動かすランタイムに合わせる（.nvmrc = 24）。
      # major が先に上がると、実際には無い API の型が通ってしまう。
      # Node.js を上げるときは .nvmrc と一緒に手で上げる。
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # ---------------------------------------------------------------------------
  # GitHub Actions (.github/workflows)
  # ---------------------------------------------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci(deps)"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
